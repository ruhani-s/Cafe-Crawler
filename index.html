<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Crawler</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <img src="images/Logo.png" alt="Cafe Crawler logo" class="logo">
    <button class="icon-btn" aria-label="Search">🔍</button>
  </header>

  <main class="page">
    <h1 class="greeting">Good Morning, <strong>Ruhani</strong></h1>

    <!-- Top Rated Cafes -->
    <section>
      <h2>Top Rated Cafes</h2>
      <div class="carousel">
        <article class="cafe-card cafe-card--large">
          <div class="cafe-card__info">
            <h3>Avenue Grid</h3>
            <p>4.2 (120) · 4.5 km away</p>
          </div>
        </article>
        <article class="cafe-card cafe-card--large">
          <div class="cafe-card__info">
            <h3>Cafe Foret</h3>
            <p>4.8 (75) · 5.2 km away</p>
          </div>
        </article>
        <article class="cafe-card cafe-card--large">
          <div class="cafe-card__info">
            <h3>Project Seoul</h3>
            <p>4.6 (60) · 6.7 km away</p>
          </div>
        </article>
      </div>
    </section>

    <!-- Saved Cafes -->
    <section>
      <h2>Your Saved Cafes</h2>
      <div class="carousel">
        <article class="cafe-card cafe-card--small">
          <div class="cafe-card__img"></div>
          <h3>Black Wolf Coffee</h3>
          <p>★★★★☆</p>
        </article>
        <article class="cafe-card cafe-card--small">
          <div class="cafe-card__img"></div>
          <h3>Dollop Coffee</h3>
          <p>★★★★☆</p>
        </article>
      </div>
    </section>

    <!-- Near You -->
    <section>
      <h2>Near You</h2>
      <div class="map-preview">Map goes here</div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active" aria-label="Home">🏠</a>
    <a href="#" aria-label="Cafes">☕</a>
    <a href="#" aria-label="Reviews">💬</a>
    <a href="#" aria-label="Map">📍</a>
  </nav>

</body>
</html>
